# Every push to main redeploys the public demo on Hugging Face.
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   HF_TOKEN  — Hugging Face access token with write permission
#   variable HF_SPACE  — the Space id, e.g. "your-hf-username/JobAnalyser"
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set — skipping deploy."; exit 0
          fi
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
